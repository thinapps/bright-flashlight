apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "top.thinapps.brightflashlight"
    compileSdk 35

    defaultConfig {
        applicationId "top.thinapps.brightflashlight"
        minSdk 24
        targetSdk 35

        versionCode 39
        versionName "0.8.5"
    }

    signingConfigs {
        release {
            // release signing values come from github actions via ~/.gradle/gradle.properties
            // do not hard-code keystore paths, aliases, or passwords
            storeFile file(project.findProperty("RELEASE_STORE_FILE"))
            storePassword project.findProperty("RELEASE_STORE_PASSWORD")
            keyAlias project.findProperty("RELEASE_KEY_ALIAS")
            keyPassword project.findProperty("RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            // keep minification disabled until there is a real need for r8 rules
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures {
        // required for generated view binding classes
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // kotlin runtime
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.24")
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    // core android runtime and lifecycle support
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"

    // material controls
    implementation "com.google.android.material:material:1.13.0"

    // local preferences
    implementation "androidx.datastore:datastore-preferences:1.2.1"
}
