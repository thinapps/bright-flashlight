apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "top.thinapps.brightflashlight"
    compileSdk 35

    defaultConfig {
        applicationId "top.thinapps.brightflashlight"
        minSdk 24
        targetSdk 35

        versionCode 28
        versionName "0.7.0"

        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            // Release signing values are supplied by GitHub Actions via ~/.gradle/gradle.properties.
            // Do not hard-code keystore paths, aliases, or passwords in the repo.
            storeFile file(project.findProperty("RELEASE_STORE_FILE"))
            storePassword project.findProperty("RELEASE_STORE_PASSWORD")
            keyAlias project.findProperty("RELEASE_KEY_ALIAS")
            keyPassword project.findProperty("RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            // Keep minification disabled for now because this small app does not need it yet.
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures {
        // Required for ActivityMainBinding and other generated view binding classes.
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/*"]
        }
    }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.24")
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    // AndroidX core UI/runtime support.
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"

    // Material Components for sliders, buttons, cards, and toggle groups.
    implementation "com.google.android.material:material:1.13.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0"

    // Local app preferences for remembered UI choices.
    implementation "androidx.datastore:datastore-preferences:1.2.1"

    // Lightweight helpers kept for compatibility/future AndroidX usage.
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.annotation:annotation:1.8.2"
}
